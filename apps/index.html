<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agni — personal assistant</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
main{max-width:520px;text-align:center}
h1{font-size:32px;margin:0 0 8px;letter-spacing:-0.02em}
p{color:#9aa0a6;margin:0 0 16px}
a{color:#8ab4ff;text-decoration:none}
a:hover{text-decoration:underline}
.card{border:1px solid #232323;border-radius:12px;padding:20px;margin-top:24px;text-align:left;background:#050505}
.card h2{font-size:14px;margin:0 0 8px;color:#cfd3d8;text-transform:uppercase;letter-spacing:.06em}
.card p{font-size:13px;margin:0}
</style>
</head>
<body>
<main>
<h1>Agni</h1>
<p>A personal assistant. You are looking at its homepage.</p>
<div class="card">
<h2>Privacy</h2>
<p>Agni stores your Google account tokens on your own daemon. They are never sent to anyone else. You can disconnect at any time from the app's Settings → Plugins pane. <a href="/privacy.html">Read the full privacy policy →</a></p>
</div>
</main>
</body>
</html>
